<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Weather Lab - Async Demo</title>

    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right,#0f2027,#203a43,#2c5364);
            color:white;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        .main-box{
            max-width:700px;
            margin:auto;
        }

        .panel{
            background:white;
            color:#222;
            padding:20px;
            border-radius:8px;
            margin-bottom:20px;
        }

        input{
            width:65%;
            padding:8px;
            border-radius:4px;
            border:1px solid #aaa;
        }

        button{
            padding:8px 12px;
            border:none;
            background:#ff7f50;
            color:white;
            border-radius:4px;
            cursor:pointer;
        }

        .history button{
            margin:5px 5px 0 0;
            background:#ff7f50;
            border-radius:15px;
            font-size:12px;
        }

        .info-line{
            display:flex;
            justify-content:space-between;
            padding:6px 0;
            border-bottom:1px solid #ddd;
        }

        .console-box{
            background:black;
            color:#00ff99;
            font-family:monospace;
            padding:10px;
            height:130px;
            overflow-y:auto;
            border-radius:5px;
        }
    </style>
</head>

<body>

<h1> Async Weather Checker</h1>

<div class="main-box">

     <!-- search -->
    <div class="panel">
        <h3>City Search</h3>
        <input type="text" id="cityInput" placeholder="Type city name">
        <button id="searchBtn">Get Weather</button>

        <h4>Previous Searches</h4>
        <div id="historyList" class="history"></div>
    </div>

    <!-- Weather  -->
    <div class="panel">
        <h3>Weather Details</h3>
        <div id="weatherInfo">
            <p style="text-align:center;color:gray;">No city selected</p>
        </div>
    </div>

    <!-- answer show   -->
    <div class="panel">
        <h3>Event Loop Console</h3>
        <div id="Box" class="console-box"></div>
    </div>

</div>

<script>

const predefinedData = {
    "delhi": { name: "Delhi", max: "35°C", min: "24°C", humidity: "50%", air: "12 km/h" },
    "indore": { name: "Indore", max: "32°C", min: "22°C", humidity: "45%", air: "10 km/h" },
    "mumbai": { name: "Mumbai", max: "30°C", min: "27°C", humidity: "85%", air: "20 km/h" },
    "london": { name: "London", max: "18°C", min: "10°C", humidity: "60%", air: "15 km/h" }
};

const cityInput = document.getElementById("cityInput");
const weatherInfo = document.getElementById("weatherInfo");
const historyList = document.getElementById("historyList");
const Box = document.getElementById("Box");

function message (msg){
    Box.innerHTML += "<div>> " + msg + "</div>"; //+= --> purane content ke end me naya content add karta hai
    Box.scrollTop = Box.scrollHeight; //scroll automatically neeche le jata hai
}

async function getWeatherData(city){

    const cityName = city.toLowerCase().trim();  // isse agar hum delhi type krte hai to vo automatically usko cappital letters mien kr dega like DELHI aur .trim() jo fltu ki sapce hoga usko hata dega
    Box.innerHTML = "";  // har new search pr jo event loop console hai usko clear kr dega  
 message ("Sync Execution Started");

    Promise.resolve().then(function(){message  ("Promise.then executed (Microtask)"); // ye ek pre relosved promise hai aur ye hai microtask hai   
    });

    setTimeout(function(){
message  ("setTimeout executed (Macrotask)");  // ye ek macrotask hai kyu 0 delay hone ke baad bhi ye promise ke baad run hoga cuz macro hamesa micro ke baad run hota hai
    },0);
message  ("Async process started...");

    try{  // ye error handling ka concept hai 

        if(!cityName){
            throw new Error("City name required"); // agar city name mien hum blanck chd dete hai to ye ERROR show karega ki "city name is required"
        }

        let data; 

        if(predefinedData[cityName]){  // ye check karega ki kya jo city humne dali hai vo pre defined mein hai ki nahi 
            data = predefinedData[cityName]; // hai agar vo pre definedd mein jo vo anser de dega
            await new Promise(function(r){
                setTimeout(r,500); // yaha humne 5 second ka delay liya cuz next step mein hum API se data fetch karenge aur data fetch krne mein thoda tinen lagta hai 
            });
        }else{
            const res = await fetch("https://api.openweathermap.org/data/2.5/weather?q="+cityName+"&units=metric&appid=8d90f23071379f824e8a4a589574889c");  //Fetch API se real weather data la raha hai.
            if(!res.ok){
                throw new Error("City not found"); // agar humne kuch esa city ka naam likh diya jo exist hi nahi krta to error dikhayega ki "city not found"
            }
            const json = await res.json();  // jo bh data aa rha hai usko JSON format mein ocnvert kr rhe hai
            data = {
                name: json.name,
                max: json.main.temp_max+"°C",
                min: json.main.temp_min+"°C",
                humidity: json.main.humidity+"%",
                air: json.wind.speed+" m/s"
            };  // jo jo bhi feild imp hai vo humne api se nikal ke ek object bana diya hai 
        }

        weatherInfo.innerHTML = 
            '<div class="info-line"><b>City</b><span>'+data.name+'</span></div>'+
            '<div class="info-line"><b>Max Temp</b><span>'+data.max+'</span></div>'+
            '<div class="info-line"><b>Min Temp</b><span>'+data.min+'</span></div>'+
            '<div class="info-line"><b>Humidity</b><span>'+data.humidity+'</span></div>'+
            '<div class="info-line"><b>Wind</b><span>'+data.air+'</span></div>';

        saveHistory(data.name);

message  ("Data loaded successfully");

    }catch(err){
        weatherInfo.innerHTML = '<p style="color:red;text-align:center;">'+ermessage +'</p>';
message  ("Error: "+message );
    }
message  ("Sync Execution Ended");
}

function saveHistory(city){
    let history = JSON.parse(localStorage.getItem("weatherHistory")) || [];
    if(!history.includes(city)){
        history.push(city);
        localStorage.setItem("weatherHistory",JSON.stringify(history));
        displayHistory();
    }
}

function displayHistory(){
    let history = JSON.parse(localStorage.getItem("weatherHistory")) || ["Delhi","Indore","Mumbai","London"];
    historyList.innerHTML = "";
    history.forEach(function(city){
        let btn = document.createElement("button");
        btn.innerText = city;
        btn.onclick = function(){
            getWeatherData(city);
        };
        historyList.appendChild(btn);
    });
}

document.getElementById("searchBtn").onclick = function(){
    getWeatherData(cityInput.value);
};

window.onload = displayHistory;

</script>

</body>
</html>
